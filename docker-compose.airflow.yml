services:
  airflow:
    image: apache/airflow:3.3.0
    user: "${AIRFLOW_UID:-50000}:0"
    command: standalone
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__PARALLELISM: "2"
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "2"
      # O pacote triagem é lido de src/, junto com dados/ e modelos/.
      PYTHONPATH: /opt/airflow/src
      _PIP_ADDITIONAL_REQUIREMENTS: "scikit-learn joblib"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./dados:/opt/airflow/dados
      - ./modelos:/opt/airflow/modelos
