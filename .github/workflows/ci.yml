name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # O ruff é um binário independente: não precisa do projeto instalado.
      - run: pip install ruff
      - run: ruff check .

  testes:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest

  build:
    name: Build da imagem
    runs-on: ubuntu-latest
    needs: [lint, testes]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t triagem-laudos .
