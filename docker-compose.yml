services:
  api:
    build: .
    restart: unless-stopped
    environment:
      MODELOS_DIR: /app/modelos-publicados
    volumes:
      - ./modelos:/app/modelos-publicados:ro
    ports:
      - "8000:8000"

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoramento/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?defina no arquivo .env}
    volumes:
      - ./monitoramento/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoramento/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
